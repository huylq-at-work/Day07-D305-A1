# Bộ câu hỏi đánh giá — Bài tập 3.2, định dạng theo docs/CONTRACTS.md §2
#
# Corpus: data/k3_university/ (10 tài liệu, chủ đề học vụ / đăng ký học phần)
# Trạng thái: QUERY FREEZE — bộ 5 câu chính thức, xác nhận ngày 03/08/2026.
# Không thay đổi câu hỏi, gold answer, filter hoặc tài liệu chuẩn sau mốc này.
#
# Mọi gold_answer dưới đây đã được đối chiếu trực tiếp với văn bản trong corpus.
# Không câu nào suy đoán quy định của trường.

queries:
  - id: Q1
    question: "Ở VinUni, sinh viên đại học chính quy được đăng ký tối đa bao nhiêu tín chỉ trong một học kỳ chính mà không phải xin phê duyệt?"
    gold_answer: >-
      Tối đa 22 tín chỉ. Mức 18–22 tín chỉ là "automatic overload", do Academic Advisor
      hoặc Program Director xem xét. Trên 22 tín chỉ phải được College Dean (hoặc người
      được Dean ủy quyền) phê duyệt. Sinh viên bắt buộc làm đơn xin overload nếu thuộc
      một trong ba trường hợp: (i) sinh viên năm nhất học kỳ đầu muốn học hơn 18 tín chỉ;
      (ii) học kỳ trước không đạt good academic standing và muốn học hơn 18 tín chỉ;
      (iii) muốn đăng ký hơn 22 tín chỉ trong học kỳ chính.
    gold_doc_id: vinuni-academic-regulations-undergrad
    metadata_filter:
      institution: vinuni
    kind: fact
    note: >-
      Câu hỏi một-chi-tiết, đáp án nằm gọn trong một bảng của Article về study load.
      Dùng làm câu dễ nhất để phát hiện lỗi hệ thống (store rỗng, embedder là mock):
      nếu Q1 cũng trượt thì vấn đề không nằm ở chiến lược chunking.

  - id: Q2
    question: "Sinh viên VinUni được rút (withdraw) một học phần đã đăng ký muộn nhất đến khi nào, và cả khóa được rút tối đa bao nhiêu tín chỉ?"
    gold_answer: >-
      Rút học phần chỉ được thực hiện sau khi hết thời hạn drop, và phải xảy ra trước khi
      hoàn thành quá 30% thời lượng học của học phần đó; sau mốc này không còn được rút và
      sinh viên bị chấm điểm theo kết quả thực tế. Học phần đã rút nhận điểm "W" trên bảng
      điểm (nếu rút trước Drop Date thì không bị ghi W). Toàn bộ chương trình học chỉ được
      rút tối đa 18 tín chỉ; đạt giới hạn này thì không được rút nữa và phải học tiếp.
    gold_doc_id: vinuni-academic-regulations-undergrad
    metadata_filter:
      audience: student
      institution: vinuni
    kind: filtered
    note: >-
      Đây là câu bắt buộc của K3 (cần metadata_filter). Không lọc thì tài liệu cạnh tranh
      mạnh nhất là vnuf-huong-dan-quy-che-tin-chi (audience=faculty), Điều 11 "Rút bớt học
      phần đã đăng ký" — nêu mốc 6–8 tuần, dùng đúng từ "rút bớt học phần" bằng tiếng Việt.
      Đó là quy định của trường khác, trả về là sai. Lọc audience=student loại nó ra.

  - id: Q3
    question: "Em muốn chuyển đổi tín chỉ đã học ở trường cũ sang VinUni thì được công nhận tối đa bao nhiêu, và phải nộp hồ sơ vào lúc nào?"
    gold_answer: >-
      Tổng số tín chỉ được chuyển đổi không vượt quá 50% tổng số tín chỉ của toàn chương
      trình (chiếu theo Article 13 của Academic Regulations). Hồ sơ nộp trong tuần đầu tiên
      của học kỳ và không muộn hơn hạn công bố trong Important Dates của kỳ nhập học đó;
      thường được xử lý trong vòng 1 tuần sau khi kết thúc thời gian add/drop. Hai loại
      không được công nhận: môn học ở bậc phổ thông (kể cả khi có bảng điểm của trường đại
      học cấp) và tín chỉ học online/từ xa lấy ngoài VinUni. Đề cương môn học phải trùng từ
      80% nội dung trở lên so với môn tương ứng ở VinUni.
    gold_doc_id: vinuni-credit-transfer
    kind: multi_doc
    metadata_filter:
      institution: vinuni
    note: >-
      Trần 50% xuất hiện ở CẢ vinuni-credit-transfer (mục 3.2) lẫn
      vinuni-academic-regulations-undergrad (Article 13), nhưng mốc thời gian nộp hồ sơ chỉ
      có trong vinuni-credit-transfer. Trả lời trọn vẹn cần chạm cả hai tài liệu — chấm
      2 điểm chỉ khi top-3 có vinuni-credit-transfer.

  - id: Q4
    question: "Em đăng ký môn xong rồi mà chưa kịp nộp tiền học thì có bị mất môn không?"
    gold_answer: >-
      Có. Sinh viên phải đóng học phí trong thời gian quy định; sau thời hạn đó Trường sẽ
      hủy các học phần chưa đóng học phí của sinh viên trên hệ thống. Việc hoàn tất đăng ký
      chỉ được tính sau khi đã đóng học phí theo đúng thời gian của khóa/hệ tương ứng.
      (Quy định của Trường Đại học Kinh tế TP.HCM — UEH.)
    gold_doc_id: ueh-dang-ky-huy-hoc-phan
    metadata_filter:
      institution: ueh
    kind: paraphrase
    note: >-
      Câu hỏi dùng từ đời thường ("mất môn", "nộp tiền học"), văn bản dùng từ hành chính
      ("hủy học phần", "đóng học phí trong thời gian quy định"). Không có từ khóa nào trùng
      nhau ngoài "học phần" — đây là chỗ embedding phải hơn tìm kiếm từ khóa, hoặc là chỗ
      nó gãy. Cả hai kết quả đều đáng viết vào phần phân tích lỗi.

  - id: Q5
    question: "Sau khi bảo lưu, sinh viên VinUni phải nộp đơn xin quay lại học trước khi học kỳ bắt đầu bao lâu?"
    gold_answer: >-
      Corpus có HAI mốc mâu thuẫn nhau. Academic Regulations (phần leave of absence) ghi
      "ít nhất một tuần trước khi học kỳ mới bắt đầu". Procedure for Requesting a Leave of
      Absence ghi "ít nhất một tháng trước khi bắt đầu học kỳ quay lại học". Câu trả lời an
      toàn là theo quy trình chi tiết hơn — nộp trước ít nhất 1 tháng — và nêu rõ có mâu
      thuẫn. Đơn nộp qua email của Office of Registrar hoặc nộp trực tiếp. Nếu không quay
      lại ngay sau khi hết thời gian bảo lưu và không xin gia hạn, hồ sơ sinh viên chuyển
      sang trạng thái không hoạt động và phải nộp lại hồ sơ qua Office of Admissions.
    gold_doc_id: vinuni-leave-of-absence
    kind: edge
    metadata_filter:
      institution: vinuni
    note: >-
      Câu duy nhất mà một câu trả lời "đúng" theo nghĩa thông thường vẫn là câu trả lời
      thiếu. Hệ thống truy xuất tốt phải kéo được CẢ HAI tài liệu lên top-3; agent trả lời
      dứt khoát "một tuần" hoặc "một tháng" mà không nêu mâu thuẫn thì chỉ được 1 điểm.
      Đây là ví dụ rõ nhất cho luận điểm "retrieval tốt không đồng nghĩa câu trả lời đúng".
